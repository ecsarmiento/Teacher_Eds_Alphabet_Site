<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn A to Z — Kids Alphabet & Phonics</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{background:#f0f4f8;padding:20px;}
        .container{max-width:500px;margin:0 auto;}
        .hero{text-align:center;margin-bottom:30px;}
        .auth-choice{display:flex;gap:15px;margin-bottom:20px;}
        .auth-btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px;cursor:pointer;}
        .signin-btn{background:#4a90d9;color:white;}
        .signup-btn{background:#2ecc71;color:white;}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;}
        .modal-box{background:white;padding:30px;border-radius:16px;max-width:420px;width:90%;position:relative;}
        .close-btn{position:absolute;top:15px;right:20px;font-size:24px;cursor:pointer;color:#888;}
        label{display:block;margin:15px 0 5px;font-weight:500;}
        input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;}
        .submit-btn{width:100%;padding:14px;background:#e07a5f;color:white;border:none;border-radius:10px;font-size:16px;margin-top:20px;cursor:pointer;}
        .message{padding:12px;border-radius:8px;margin-bottom:15px;text-align:center;}
        .error{background:#ffebee;color:#c62828;}
        .success{background:#e8f5e9;color:#2e7d32;}
        .switch-link{text-align:center;margin-top:15px;}
    </style>
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1>🌟 Learn A to Z — Fun & Free! 🌟</h1>
            <p>Grades 1–3 • Free for Teachers & Parents • Interactive with Sound & Pictures</p>
        </header>

        <div class="auth-choice">
            <button class="auth-btn signin-btn" onclick="openModal('loginModal')">🔑 Sign In</button>
            <button class="auth-btn signup-btn" onclick="openModal('registerModal')">✏️ Sign Up</button>
        </div>

        <!-- LOGIN MODAL -->
        <div id="loginModal" class="modal">
            <div class="modal-box">
                <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
                <h2>Welcome Back! 👋</h2>
                <div id="loginMsg" class="message"></div>
                <form id="loginForm">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="your@email.com" required>
                    
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Your password" required>
                    
                    <button type="submit" class="submit-btn">Sign Me In</button>
                </form>
                <p class="switch-link">New here? <a href="#" onclick="switchModal('loginModal','registerModal')">Create an account</a></p>
            </div>
        </div>

        <!-- REGISTER MODAL -->
        <div id="registerModal" class="modal">
            <div class="modal-box">
                <span class="close-btn" onclick="closeModal('registerModal')">&times;</span>
                <h2>Join Our Learning Family 🎓</h2>
                <div id="registerMsg" class="message"></div>
                <form id="registerForm">
                    <label>Your Full Name</label>
                    <input type="text" name="full_name" placeholder="e.g. Ederlyn Sarmiento" required>
                    
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="your@email.com" required>
                    
                    <label>Create Password</label>
                    <input type="password" name="password" placeholder="At least 6 characters" required>
                    
                    <label>I am a:</label>
                    <select name="role" required>
                        <option value="">-- Please choose --</option>
                        <option value="teacher">🏫 Teacher</option>
                        <option value="parent">🏠 Parent</option>
                    </select>
                    
                    <button type="submit" class="submit-btn">Create My Account</button>
                </form>
                <p class="switch-link">Already have an account? <a href="#" onclick="switchModal('registerModal','loginModal')">Sign in here</a></p>
            </div>
        </div>
    </div>

    <script>
        const PHP_HOST = "https://eds.page.gd";

        function openModal(id){ document.getElementById(id).style.display='flex'; }
        function closeModal(id){ document.getElementById(id).style.display='none'; }
        function switchModal(from,to){ closeModal(from); openModal(to); }
        
        window.onclick = function(e){
            if(e.target.classList.contains('modal')) e.target.style.display='none';
        };

        function showMessage(elId, text, isSuccess){
            const el = document.getElementById(elId);
            el.textContent = text;
            el.className = 'message ' + (isSuccess ? 'success' : 'error');
        }

        // LOGIN
        document.getElementById('loginForm').addEventListener('submit', function(e){
            e.preventDefault();
            showMessage('loginMsg', 'Checking... ⏳');
            
            fetch(`${PHP_HOST}/login.php`, {
                method: 'POST',
                credentials: 'include',
                mode: 'cors',
                body: new FormData(this)
            })
            .then(r => {
                if (!r.ok) throw new Error("Server error: " + r.status);
                return r.json();
            })
            .then(data => {
                if(data.success){
                    showMessage('loginMsg', `Welcome back, ${data.full_name}! ✅ Redirecting...`, true);
                    setTimeout(() => window.location.href = 'dashboard.html', 1200);
                } else {
                    showMessage('loginMsg', '❌ ' + data.error);
                }
            })
            .catch(err => {
                console.error('Login error:', err);
                showMessage('loginMsg', '❌ Connection error: ' + err.message);
            });
        });

        // REGISTER
        document.getElementById('registerForm').addEventListener('submit', function(e){
            e.preventDefault();
            showMessage('registerMsg', 'Creating account... ⏳');
            
            fetch(`${PHP_HOST}/register.php`, {
                method: 'POST',
                credentials: 'include',
                mode: 'cors',
                body: new FormData(this)
            })
            .then(r => {
                if (!r.ok) throw new Error("Server error: " + r.status);
                return r.json();
            })
            .then(data => {
                if(data.success){
                    showMessage('registerMsg', `Welcome, ${data.full_name}! ✅ Redirecting...`, true);
                    setTimeout(() => window.location.href = 'dashboard.html', 1200);
                } else {
                    showMessage('registerMsg', '❌ ' + data.error);
                }
            })
            .catch(err => {
                console.error('Register error:', err);
                showMessage('registerMsg', '❌ Connection error: ' + err.message);
            });
        });
    </script>
</body>
</html>
